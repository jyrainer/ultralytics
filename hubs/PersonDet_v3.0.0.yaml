task: detect  # (str) YOLO task, i.e. detect, segment, classify, pose
mode: train  # (str) YOLO mode, i.e. train, val, predict, export, track, benchmark

# Train settings -------------------------------------------------------------------------------------------------------
model: yolo11s.pt # (str, optional) path to model file, i.e. yolov8n.pt, yolov8n.yaml
data: /home/gpuadmin/repo/KISA/kisa-od-model-trainer/datasets/COCO_person_v0.0.0/new_coco_dataset/data.yaml
project: PersonDet_v3.0.0 # (str, optional) project name
name: artifacts # (str, optional) experiment name, results saved to 'project/name' directory
epochs: 3  # (int) number of epochs to train for
patience: 200  # (int) epochs to wait for no observable improvement for early stopping of training
batch: 64  # (int) number of images per batch (-1 for AutoBatch)
imgsz:
- 640
- 640  # (int | list) input images size as int for train and val modes, or list[w,h] for predict and export modes

device: 0,1  # (int | str | list, optional) device to run on, i.e. cuda device=0 or device=0,1,2,3 or device=cpu
save: True  # (bool) save train checkpoints and predict results
save_period: 0 # (int) Save checkpoint every x epochs (disabled if < 1)
cache: False  # (bool) True/ram, disk or False. Use cache for data loading
workers: 8  # (int) number of worker threads for data loading (per RANK if DDP)
exist_ok: False  # (bool) whether to overwrite existing experiment
pretrained: True  # (bool | str) whether to use a pretrained model (bool) or a model to load weights from (str)
verbose: True  # (bool) whether to print verbose output
seed: 0  # (int) random seed for reproducibility
deterministic: True  # (bool) whether to enable deterministic mode
single_cls: False  # (bool) train multi-class data as single-class
rect: False  # (bool) rectangular training if mode='train' or rectangular validation if mode='val'
close_mosaic: 10  # (int) disable mosaic augmentation for final epochs (0 to disable)
resume: False  # (bool) resume training from last checkpoint
amp: True  # (bool) Automatic Mixed Precision (AMP) training, choices=[True, False], True runs AMP check
fraction: 1.0  # (float) dataset fraction to train on (default is 1.0, all images in train set)
profile: False  # (bool) profile ONNX and TensorRT speeds during training for loggers
freeze: 0  # (int | list, optional) freeze first n layers, or freeze list of layer indices during training

#Custom but not hp
cos_lr: True  # (bool) use cosine learning rate scheduler
dropout: 0.2
optimizer: auto  # (str) optimizer to use, choices=[SGD, Adam, Adamax, AdamW, NAdam, RAdam, RMSProp, auto]
warmup_bias_lr: 0.1

#hpo
lr0: 0.00869
lrf: 0.01174
momentum: 0.70823
weight_decay: 0.0002
warmup_epochs: 3.93697
warmup_momentum: 0.70517
box: 5.0739
cls: 0.2702
dfl: 0.49776
hsv_h: 0.00772
hsv_s: 0.67204
hsv_v: 0.35957
degrees: 0.0
translate: 0.06037
scale: 0.3685
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.36929
mosaic: 0.8177
mixup: 0.1
copy_paste: 0.0
